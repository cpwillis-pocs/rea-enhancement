name: ci

# Gate for contributors' PRs, plus an on-demand run (Actions tab -> ci -> Run workflow) that can
# pick a suite, repeat e2e to hunt flakes, or regenerate the README screenshots as an artifact.
# Deliberately no push or schedule triggers, to keep within the repo's monthly Actions minutes:
# run `npm run ci` locally, or this workflow on demand, before releasing.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: What to run
        type: choice
        default: all
        options: [all, lint, unit, e2e, coverage, screenshots]
      repeat:
        description: Run each e2e file this many times (flake hunting)
        type: choice
        default: '1'
        options: ['1', '3', '5', '10']
      artifacts:
        description: Upload e2e logs and screenshots even when everything passes
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same PR supersedes the older run; on-demand runs always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PLAYWRIGHT_VERSION: 1.56.1
  AXE_VERSION: 4.13.0 # test-only, for a11y.js; never shipped
  FORCE_COLOR: 1

jobs:
  # What a PR needs, from the files it changes (test/ci-changes.js): docs-only PRs skip unit and
  # e2e, unit-test-only PRs skip e2e, e2e-only PRs run unit on Node 20 only. A job skipped by its
  # `if` counts as passing for required checks; paths-ignore would leave them pending instead.
  # On-demand runs always run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      unit: ${{ steps.diff.outputs.unit }}
      e2e: ${{ steps.diff.outputs.e2e }}
      nodes: ${{ steps.diff.outputs.nodes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then printf 'unit=true\ne2e=true\nnodes=[20,22,24]\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --name-only "$BASE" HEAD | tee changed.txt
          node test/ci-changes.js < changed.txt | tee -a "$GITHUB_OUTPUT"

  lint:
    if: github.event_name != 'workflow_dispatch' || inputs.suite != 'screenshots' # every suite but screenshots builds on it
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Syntax, header, changelog, privacy and storage-key invariants
        run: npm run lint

  unit:
    if: needs.changes.outputs.unit == 'true' && (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","unit"]'), inputs.suite))
    needs: [lint, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.changes.outputs.nodes) }} # engines.node is >=20; e2e-only PRs test Node 20 only
    env:
      TZ: ${{ matrix.node == 20 && 'America/Los_Angeles' || 'Australia/Sydney' }} # dates must not depend on the runner's zone
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        run: |
          node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=junit-node${{ matrix.node }}.xml test/*.test.js
      - name: Summary
        if: always()
        run: |
          f=junit-node${{ matrix.node }}.xml
          [ -f "$f" ] || exit 0
          tests=$(grep -o '<testcase ' "$f" | wc -l); fails=$(grep -o '<failure' "$f" | wc -l)
          echo "### Unit tests on Node ${{ matrix.node }}: $((tests - fails))/$tests passed" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-junit-node${{ matrix.node }}
          path: junit-node${{ matrix.node }}.xml
          retention-days: 14

  e2e:
    if: needs.changes.outputs.e2e == 'true' && (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","e2e"]'), inputs.suite))
    needs: [lint, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        file: [smoke, edge, a11y] # independent, so they run in parallel
    env:
      E2E_ARTIFACTS: e2e-artifacts
      E2E_TIMEOUT_MS: '600000'
      E2E_JOBS: '3' # edge.js runs 3 scenario blocks at once (each in its own browser context); smoke.js ignores it
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: ./.github/actions/setup-playwright
        with:
          version: ${{ env.PLAYWRIGHT_VERSION }}
      - name: axe-core (a11y only)
        if: matrix.file == 'a11y'
        run: npm install --no-save --no-audit --no-fund "axe-core@$AXE_VERSION"
      - name: e2e ${{ matrix.file }} (x${{ inputs.repeat || '1' }})
        run: |
          n=${{ inputs.repeat || '1' }}
          for i in $(seq 1 "$n"); do
            echo "::group::run $i of $n"
            start=$(date +%s)
            node test/e2e/${{ matrix.file }}.js || { echo "::error::e2e ${{ matrix.file }} failed on run $i of $n"; exit 1; }
            echo "::endgroup::"
            echo "run $i: $(( $(date +%s) - start ))s" >> e2e-times.txt
          done
      - name: Summary
        if: always()
        run: |
          { echo "### e2e ${{ matrix.file }}: ${{ job.status }}"; [ -f e2e-times.txt ] && sed 's/^/- /' e2e-times.txt; true; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure() || inputs.artifacts
        with:
          name: e2e-${{ matrix.file }}-artifacts
          path: e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # UI line coverage from both e2e files, held to a floor so new UI code comes with a scenario.
  coverage:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","coverage"]'), inputs.suite)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COVERAGE_MIN: '98'
      E2E_ARTIFACTS: e2e-artifacts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: ./.github/actions/setup-playwright
        with:
          version: ${{ env.PLAYWRIGHT_VERSION }}
      - name: Unit + e2e coverage
        run: npm run coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage-e2e.txt
            e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # On demand only: regenerate docs/screenshots from fixtures and hand them back as an artifact
  # (commit them yourself if they look right).
  screenshots:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'screenshots'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: ./.github/actions/setup-playwright
        with:
          version: ${{ env.PLAYWRIGHT_VERSION }}
      - run: npm run screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/
          retention-days: 14

  # Installs auto-update from main via @updateURL, and Tampermonkey only installs a
  # higher @version, so a script change without a bump would never reach users.
  version-bump:
    # PRs compare against their base.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require @version bump when the userscript changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          f=rea-availability-filter.user.js
          if git diff --quiet "$BASE" HEAD -- "$f"; then echo "script unchanged"; exit 0; fi
          ver() { sed -n 's#^// @version *##p' | head -1; }
          old=$(git show "$BASE:$f" | ver); new=$(ver < "$f")
          echo "base $old -> head $new"
          [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -1)" = "$new" ] && [ "$old" != "$new" ] \
            || { echo "::error file=$f::Bump // @version (currently $new, base $old)"; exit 1; }
