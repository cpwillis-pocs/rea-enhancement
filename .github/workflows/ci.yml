name: ci

# Runs on PRs so outside contributions get the same gate as `npm run check` locally.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # version check diffs against the PR base
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # No dependencies to install for unit tests; playwright only for the browser smoke test.
      - run: npm run check
      - run: npx -y playwright@1.56.1 install --with-deps chromium
      - run: npm install --no-save playwright@1.56.1
      - run: npm run e2e

  # Installs auto-update from main via @updateURL, and Tampermonkey only installs a
  # higher @version, so a script change without a bump would never reach users.
  version-bump:
    # PRs compare against their base; direct pushes to main against the previous tip.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require @version bump when the userscript changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          f=rea-availability-filter.user.js
          if git diff --quiet "$BASE" HEAD -- "$f"; then echo "script unchanged"; exit 0; fi
          ver() { sed -n 's#^// @version *##p' | head -1; }
          old=$(git show "$BASE:$f" | ver); new=$(ver < "$f")
          echo "base $old -> head $new"
          [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -1)" = "$new" ] && [ "$old" != "$new" ] \
            || { echo "::error file=$f::Bump // @version (currently $new, base $old)"; exit 1; }
